[package]
name = "pingora-boringssl"
version = "0.8.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "tls", "ssl", "pingora"]
description = """
BoringSSL async APIs for Pingora.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pingora_boringssl"
path = "src/lib.rs"

[dependencies]
boring = { workspace = true } # PQ is always enabled in 5
boring-sys = { workspace = true }
futures-util = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt-multi-thread"] }
libc = { workspace = true }
foreign-types-shared = { workspace = true }


[dev-dependencies]
tokio-test = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[features]
default = []
pq_use_second_keyshare = []
