[package]
name = "pingora-core"
version = "0.8.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "http", "network", "pingora"]
exclude = ["tests/*"]
description = """
Pingora's APIs and traits for the core network protocols.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pingora_core"
path = "src/lib.rs"

[dependencies]
pingora-runtime = { workspace = true }
pingora-openssl = { workspace = true, optional = true }
pingora-boringssl = { workspace = true, optional = true }
pingora-pool = { workspace = true }
pingora-error = { workspace = true }
pingora-timeout = { workspace = true }
pingora-http = { workspace = true }
pingora-rustls = { workspace = true, optional = true }
pingora-s2n = { workspace = true, optional = true }
bstr = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
httparse = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
log = { workspace = true }
h2 = { workspace = true }
derivative.workspace = true
clap = { workspace = true, features = ["derive"] }
once_cell = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
libc = { workspace = true }
chrono = { workspace = true, features = ["alloc"], default-features = false }
sentry = { workspace = true, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
], default-features = false, optional = true }
regex = { workspace = true }
percent-encoding = { workspace = true }
parking_lot = { workspace = true, features = ["arc_lock"] }
socket2 = { workspace = true, features = ["all"] }
flate2 = { workspace = true, features = ["zlib-ng"], default-features = false }
sfv = { workspace = true }
rand = { workspace = true }
ahash = { workspace = true }
unicase = { workspace = true }
brotli = { workspace = true }
openssl-probe = { workspace = true }
tokio-test = { workspace = true }
zstd = { workspace = true }
httpdate = { workspace = true }
x509-parser = { workspace = true, optional = true }
ouroboros = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
daggy = { workspace = true }

[target.'cfg(unix)'.dependencies]
flurry = { workspace = true }
daemonix = { workspace = true }
nix = { workspace = true, features = ["socket", "net", "fs", "uio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
h2 = { workspace = true, features = ["unstable"] }
tokio-stream = { workspace = true, features = ["full"] }
env_logger = { workspace = true }
reqwest = { workspace = true, features = [
    "rustls",
    "http2",
], default-features = false }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2"] }
http-body-util = { workspace = true }
rstest = { workspace = true }
rustls = { workspace = true }

[[bench]]
name = "h1_pipelining"
harness = false

[target.'cfg(unix)'.dev-dependencies]
hyperlocal = { workspace = true }
# Match foundations' allocator so workspace all-features tests link one jemalloc.
jemallocator = { workspace = true }

[features]
default = []
# Requires building with `--cfg tokio_unstable`.
dial9 = ["pingora-runtime/dial9"]
dial9-worker-s3 = ["dial9", "pingora-runtime/dial9-worker-s3"]
dial9-cpu-profiling = ["dial9", "pingora-runtime/dial9-cpu-profiling"]
openssl = ["pingora-openssl", "openssl_derived"]
boringssl = ["pingora-boringssl", "openssl_derived"]
rustls = ["pingora-rustls", "any_tls", "dep:x509-parser", "ouroboros"]
s2n = ["pingora-s2n", "any_tls", "dep:x509-parser", "ouroboros", "lru"]
patched_http1 = ["pingora-http/patched_http1"]
openssl_derived = ["any_tls"]
any_tls = []
sentry = ["dep:sentry"]
connection_filter = []
