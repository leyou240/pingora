[package]
name = "pingora-ketama"
version = "0.8.0"
description = "Rust port of the nginx consistent hash function"
authors = ["Pingora Team <pingora@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["caching", "algorithms"]
keywords = ["hash", "hashing", "consistent", "pingora"]

[dependencies]
crc32fast = { workspace = true }
i_key_sort = { workspace = true, optional = true, features = [
    "allow_multithreading",
] }

[dev-dependencies]
criterion = { workspace = true }
csv = { workspace = true }
dhat = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "simple"
harness = false

[[bench]]
name = "memory"
harness = false

[features]
heap-prof = []
v2 = ["i_key_sort"]
