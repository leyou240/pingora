[package]
name = "pingora-load-balancing"
version = "0.8.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["network-programming"]
keywords = ["proxy", "pingora"]
description = """
Common load balancing features for Pingora proxy.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pingora_load_balancing"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
pingora-http = { workspace = true }
pingora-error = { workspace = true }
pingora-core = { workspace = true, default-features = false }
pingora-ketama = { workspace = true }
pingora-runtime = { workspace = true }
arc-swap = { workspace = true }
fnv = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
http = { workspace = true }
derivative.workspace = true

[dev-dependencies]

[features]
default = []
openssl = ["pingora-core/openssl", "openssl_derived"]
boringssl = ["pingora-core/boringssl", "openssl_derived"]
rustls = ["pingora-core/rustls", "any_tls"]
s2n = ["pingora-core/s2n", "any_tls"]
openssl_derived = ["any_tls"]
any_tls = []
v2 = ["pingora-ketama/v2"]
