[package]
name = "pingora-memory-cache"
version = "0.8.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["algorithms", "caching"]
keywords = ["async", "cache", "pingora"]
description = """
An async in-memory cache with cache stampede protection.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pingora_memory_cache"
path = "src/lib.rs"

[dependencies]
tinyufo = { workspace = true }
ahash = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
pingora-error = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
pingora-timeout = { workspace = true }

[dev-dependencies]
once_cell = { workspace = true }
