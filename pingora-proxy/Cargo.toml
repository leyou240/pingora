[package]
name = "pingora-proxy"
version = "0.8.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/cloudflare/pingora"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "http", "proxy", "pingora"]
exclude = ["tests/*"]
description = """
Pingora HTTP proxy APIs and traits.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pingora_proxy"
path = "src/lib.rs"

[dependencies]
pingora-error = { workspace = true }
pingora-core = { workspace = true, default-features = false }
pingora-cache = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["macros", "net"] }
pingora-http = { workspace = true }
http = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
h2 = { workspace = true }
once_cell = { workspace = true }
clap = { workspace = true, features = ["derive"] }
regex = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = [
    "gzip",
    "rustls",
    "http2",
], default-features = false }
httparse = { workspace = true }
tokio-test = { workspace = true }
env_logger = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2"] }
http-body-util = { workspace = true }
tokio-tungstenite = { workspace = true }
pingora-limits = { workspace = true }
pingora-load-balancing = { workspace = true, default-features = false }
pingora-prometheus = { workspace = true }
prometheus = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
hyperlocal = { workspace = true }

[features]
default = []
openssl = ["pingora-core/openssl", "pingora-cache/openssl", "openssl_derived"]
boringssl = [
    "pingora-core/boringssl",
    "pingora-cache/boringssl",
    "openssl_derived",
]
rustls = ["pingora-core/rustls", "pingora-cache/rustls", "any_tls"]
s2n = ["pingora-core/s2n", "pingora-cache/s2n", "any_tls"]
openssl_derived = ["any_tls"]
any_tls = []
sentry = ["pingora-core/sentry"]
patched_http1 = ["pingora-core/patched_http1"]
upstream_modules = []
connection_filter = ["pingora-core/connection_filter"]
trace = ["pingora-cache/trace"]

[[example]]
name = "connection_filter"
required-features = ["connection_filter"]

# or locally cargo doc --config "build.rustdocflags='--cfg doc_async_trait'"
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "doc_async_trait"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(doc_async_trait)'] }
