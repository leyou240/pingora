[package]
name = "pingora"
version = "0.8.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
description = """
A framework to build fast, reliable and programmable networked systems at Internet scale.
"""
categories = ["asynchronous", "network-programming"]
keywords = ["async", "proxy", "http", "pingora"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pingora"
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["document-features"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
pingora-core = { workspace = true, default-features = false }
pingora-http = { workspace = true }
pingora-timeout = { workspace = true }
pingora-load-balancing = { workspace = true, optional = true, default-features = false }
pingora-proxy = { workspace = true, optional = true, default-features = false }
pingora-cache = { workspace = true, optional = true, default-features = false }


# Only used for documenting features, but doesn't work in any other dependency 
# group :(
document-features = { workspace = true, optional = true }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
env_logger = { workspace = true }
reqwest = { workspace = true, features = [
    "rustls",
    "http2",
], default-features = false }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2"] }
http-body-util = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
log = { workspace = true }
pingora-prometheus = { workspace = true }
prometheus = { workspace = true }
once_cell = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
hyperlocal = { workspace = true }
# Match foundations' allocator so workspace all-features tests link one jemalloc.
jemallocator = { workspace = true }

[features]
default = []

#! ### Tls
#! Tls is provided by adding one of these features. If no tls-providing feature
#! is added, only unencrypted http. Only one tls-providing feature can be
#! selected at a time

## Use [OpenSSL](https://crates.io/crates/openssl) for tls
##
## Requires native openssl libraries and build tooling
openssl = [
    "pingora-core/openssl",
    "pingora-proxy?/openssl",
    "pingora-cache?/openssl",
    "pingora-load-balancing?/openssl",
    "openssl_derived",
]

## Use [BoringSSL](https://crates.io/crates/boring) for tls 
##
## Requires native boring libraries and build tooling
boringssl = [
    "pingora-core/boringssl",
    "pingora-proxy?/boringssl",
    "pingora-cache?/boringssl",
    "pingora-load-balancing?/boringssl",
    "openssl_derived",
]

## Use  [s2n-tls](https://crates.io/crates/s2n-tls) for tls
##
## Requires native s2n-tls libraries and build tooling
s2n = [
    "pingora-core/s2n",
    "pingora-proxy?/s2n",
    "pingora-cache?/s2n",
    "pingora-load-balancing?/s2n",
    "any_tls",
]

## Use  [rustls](https://crates.io/crates/rustls) for tls 
##
## ⚠️ _Highly Experimental_! ⚠️ Try it, but don't rely on it (yet)
rustls = [
    "pingora-core/rustls",
    "pingora-proxy?/rustls",
    "pingora-cache?/rustls",
    "pingora-load-balancing?/rustls",
    "any_tls",
]

#! ### Pingora extensions

## Include the [proxy](crate::proxy) module
##
## This feature will include and export `pingora_proxy::prelude::*`
proxy = ["pingora-proxy"]

## Include the [lb](crate::lb) (load-balancing) module
##
## This feature will include and export `pingora_load_balancing::prelude::*`
lb = ["pingora-load-balancing", "proxy"]

## Include the [cache](crate::cache) module
##
## This feature will include and export `pingora_cache::prelude::*`
cache = ["pingora-cache"]

## Enable time/scheduling functionality
time = []

## Enable sentry for error notifications
sentry = ["pingora-core/sentry"]

## Enable dial9 Tokio runtime telemetry configuration.
##
## Requires building with `--cfg tokio_unstable`.
dial9 = ["pingora-core/dial9"]

## Enable dial9 S3-compatible trace segment upload support.
dial9-worker-s3 = ["dial9", "pingora-core/dial9-worker-s3"]

## Enable dial9 CPU profiling support.
dial9-cpu-profiling = ["dial9", "pingora-core/dial9-cpu-profiling"]

## Enable upstream modules: the `adjust_upstream_modules` callback, the
## `upstream_modules_ctx` on Session, and `init_upstream_modules` on ProxyHttp.
##
## Allows registering custom upstream modules that process response tasks
## before `upstream_compression`, and configuring them.
upstream_modules = ["pingora-proxy?/upstream_modules"]

## Enable pre-TLS connection filtering
connection_filter = [
    "pingora-core/connection_filter",
    "pingora-proxy?/connection_filter",
]


# These features are intentionally not documented
openssl_derived = ["any_tls"]
any_tls = []
patched_http1 = ["pingora-core/patched_http1", "pingora-proxy?/patched_http1"]
document-features = [
    "dep:document-features",
    "proxy",
    "lb",
    "cache",
    "time",
    "sentry",
    "dial9",
    "dial9-worker-s3",
    "dial9-cpu-profiling",
    "connection_filter",
]
trace = ["pingora-cache?/trace", "pingora-proxy?/trace"]
