[package]
name = "TinyUFO"
version = "0.8.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
edition = "2021"
license = "Apache-2.0"
description = "In-memory cache implementation with TinyLFU as the admission policy and S3-FIFO as the eviction policy"
repository = "https://github.com/cloudflare/pingora"
categories = ["algorithms", "caching"]
keywords = ["cache", "pingora"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tinyufo"
path = "src/lib.rs"

[dependencies]
ahash = { workspace = true }
flurry = { workspace = true }
crossbeam-queue = { workspace = true }
crossbeam-skiplist = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
lru = { workspace = true }
rand_distr = { workspace = true }
moka = { workspace = true, features = ["sync"] }
dhat = { workspace = true }
quick_cache = { workspace = true }
triomphe = { workspace = true } # 0.1.12 requires Rust 1.76

[[bench]]
name = "bench_perf"
harness = false

[[bench]]
name = "bench_hit_ratio"
harness = false

[[bench]]
name = "bench_memory"
harness = false
